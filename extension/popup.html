<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      width: 350px;
      padding: 15px;
    }

    h3 {
      margin-top: 0;
      color: #333;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #00818e;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn:hover {
      background: #006b75;
    }

    .btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }

    .version {
      font-size: 10px;
      color: #999;
      text-align: right;
      margin-top: 20px;
      border-top: 1px solid #eee;
      padding-top: 5px;
    }

    input[type="file"] {
      margin: 10px 0;
    }

    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 15px 0;
    }
  </style>
</head>

<body>
  <h3>Revas 採購助手</h3>

  <button id="btnScan" class="btn">1. 解析網頁並匯出 CSV</button>
  <div id="status">等待操作...</div>

  <hr>

  <label for="csvFile" style="font-size:13px; font-weight:bold;">2. 上傳訂單 (Revas_Master_Order_List...)</label>
  <input type="file" id="csvFile" accept=".csv">
  <button id="btnPreview" class="btn" disabled>3. 預覽訂單</button>

  <div id="previewContainer" style="display:none; margin-top: 15px;">
    <h4 style="margin: 5px 0;">訂單預覽</h4>
    <div style="max-height: 200px; overflow-y: auto; border: 1px solid #eee; font-size: 11px; margin-bottom: 10px;">
      <table id="previewTable" style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="background: #f5f5f5; text-align: left;">
            <th style="padding: 4px;">供應商</th>
            <th style="padding: 4px;">項目</th>
            <th style="padding: 4px;">數量</th>
            <th style="padding: 4px;">總價</th>
            <th style="padding: 4px;">狀態</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <button id="btnConfirm" class="btn" style="background: #d9534f;">4. 確認並送出訂單</button>
  </div>

  <div
    style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px; padding: 10px; background: #f9f9f9; border-radius: 4px;">
    <label for="autoClickToggle" style="font-weight: bold; color: #333;">啟用自動點擊 (Cancel)</label>
    <input type="checkbox" id="autoClickToggle" style="transform: scale(1.5);">
  </div>

  <button id="btnClearState" class="btn" style="background: #e0e0e0; color: #333; margin-top: 15px;">🗑️ 清除暫存狀態</button>

  <div class="version">
    Version: 1.1.4 <br>
    Update: Added state persistence (storage). Added clear state button.
  </div>

  <script src="popup.js"></script>
</body>

</html>
